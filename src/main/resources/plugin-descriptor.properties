# Elasticsearch plugin descriptor. Values are filtered in from the pom at build time.
# See https://www.elastic.co/guide/en/elasticsearch/plugins/current/plugin-authors.html
classname=org.elasticsearch.plugins.analysis.phone.PhonePlugin
name=analysis-phone
description=Elasticsearch plugin for phone, SIP and email analysis (libphonenumber-backed).
version=${project.version}
# Must match the Elasticsearch node version exactly.
elasticsearch.version=${elasticsearch.version}
# Minimum Java version the plugin was compiled for.
java.version=${maven.compiler.release}
