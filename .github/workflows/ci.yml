name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, run tests, and assemble the plugin zip
        run: mvn -B --no-transfer-progress clean package

      - name: Upload plugin zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elasticsearch-phone-plugin
          path: target/releases/*.zip
          if-no-files-found: error
